  <body>
    <div id="map" aria-label="Satellite look-ahead map"></div>

    <div id="zoom-controls" role="group" aria-label="Map zoom">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    </div>

    <section id="hud" aria-live="polite">
      <div class="hud-speed">
        <span id="hud-speed">—</span>
        <span class="hud-unit">km/h</span>
        <div class="hud-trip">
          <p class="hud-trip-readout">
            <span id="hud-trip">0.000</span>
            <span class="hud-trip-unit">km</span>
          </p>
          <button type="button" id="trip-reset">Reset</button>
        </div>
      </div>
      <div class="hud-roads">
        <p class="hud-current">
          <span class="hud-label">Now</span>
          <span id="hud-current-road">Current road</span>
        </p>
        <p class="hud-next">
          <span class="hud-label">Next</span>
          <span id="hud-next-road">Next road</span>
        </p>
        <p id="hud-turn" class="hud-turn">Next turn</p>
      </div>
    </section>

    <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
    <script>
      (function () {
        var Orig = maplibregl.Map;
        maplibregl.Map = function (opts) {
          if (opts) opts.minZoom = 8;
          var m = new Orig(opts);
          var done = false;
          var ready = function () {
            if (done) return;
            if (m.areTilesLoaded && !m.areTilesLoaded()) return;
            done = true;
            document.documentElement.classList.add("tiles-ready");
          };
          m.on("render", ready);
          m.on("idle", ready);
          setTimeout(ready, 6000);
          var ring = null;
          var cv = document.createElement("canvas");
          cv.className = "grading-overlay";
          cv.setAttribute("aria-hidden", "true");
          fetch("/assets/shire.json").then(function (r) { return r.json(); }).then(function (a) {
            var n = 1e5, d = a.r, e = [], i;
            for (i = 0; i < d.length; i += 2) e.push([d[i] / n, d[i + 1] / n]);
            ring = e;
            drawShire();
          });
          function drawShire() {
            if (!ring) return;
            var mc = m.getCanvas && m.getCanvas();
            if (!mc) return;
            if (!cv.parentNode && mc.parentNode) mc.parentNode.appendChild(cv);
            var ctx = cv.getContext("2d");
            if (!ctx) return;
            var pr = (m.getPixelRatio && m.getPixelRatio()) || 1;
            var w = mc.clientWidth, h = mc.clientHeight;
            cv.width = Math.max(1, Math.round(w * pr));
            cv.height = Math.max(1, Math.round(h * pr));
            cv.style.width = w + "px";
            cv.style.height = h + "px";
            ctx.setTransform(pr, 0, 0, pr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.lineJoin = "round";
            ctx.beginPath();
            var p = m.project(ring[0]);
            ctx.moveTo(p.x, p.y);
            for (var i = 1; i < ring.length; i++) {
              p = m.project(ring[i]);
              ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
            ctx.stroke();
          }
          m.on("render", drawShire);
          return m;
        };
        maplibregl.Map.prototype = Orig.prototype;
      })();
    </script>
