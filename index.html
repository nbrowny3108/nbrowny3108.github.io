  <body>
    <div id="map" aria-label="Satellite look-ahead map"></div>

    <div id="zoom-controls" role="group" aria-label="Map zoom">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    </div>

    <section id="hud" aria-live="polite">
      <div class="hud-speed">
        <span id="hud-speed">—</span>
        <span class="hud-unit">km/h</span>
        <div class="hud-trip">
          <p class="hud-trip-readout">
            <span id="hud-trip">0.000</span>
            <span class="hud-trip-unit">km</span>
          </p>
          <button type="button" id="trip-reset">Reset</button>
        </div>
      </div>
      <div class="hud-roads">
        <p class="hud-current">
          <span class="hud-label">Now</span>
          <span id="hud-current-road">Current road</span>
        </p>
        <p class="hud-next">
          <span class="hud-label">Next</span>
          <span id="hud-next-road">Next road</span>
        </p>
        <p id="hud-turn" class="hud-turn">Next turn</p>
      </div>
    </section>

    <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
    <script>
      (function () {
        var Orig = maplibregl.Map;
        maplibregl.Map = function (opts) {
          if (opts) opts.minZoom = 10;
          var m = new Orig(opts);
          var done = false;
          var ready = function () {
            if (done) return;
            if (m.areTilesLoaded && !m.areTilesLoaded()) return;
            done = true;
            document.documentElement.classList.add("tiles-ready");
          };
          m.on("render", ready);
          m.on("idle", ready);
          setTimeout(ready, 6000);
          return m;
        };
        maplibregl.Map.prototype = Orig.prototype;
      })();
    </script>
    <script src="/assets/app.js?v=4"></script>
