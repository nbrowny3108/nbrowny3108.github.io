<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Look-ahead" />
    <meta name="theme-color" content="#070a08" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" />
    <title>Look-ahead — Horsham</title>
    <link rel="stylesheet" href="/assets/style-afjQ3w3-.css">
    <link
      rel="preload"
      as="image"
      href="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=142.19687,-36.71287,142.20113,-36.70540&bboxSR=4326&imageSR=3857&size=440,956&format=jpg&f=image"
    />
    <style>
      #map {
        background: #070a08 url("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=142.19687,-36.71287,142.20113,-36.70540&bboxSR=4326&imageSR=3857&size=440,956&format=jpg&f=image") center / cover no-repeat;
      }
      .maplibregl-canvas {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Satellite look-ahead map"></div>

    <div id="zoom-controls" role="group" aria-label="Map zoom">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    </div>

    <section id="hud" aria-live="polite">
      <div class="hud-speed">
        <span id="hud-speed">—</span>
        <span class="hud-unit">km/h</span>
        <div class="hud-trip">
          <p class="hud-trip-readout">
            <span id="hud-trip">0.000</span>
            <span class="hud-trip-unit">km</span>
          </p>
          <button type="button" id="trip-reset">Reset</button>
        </div>
      </div>
      <div class="hud-roads">
        <p class="hud-current">
          <span class="hud-label">Now</span>
          <span id="hud-current-road">Current road</span>
        </p>
        <p class="hud-next">
          <span class="hud-label">Next</span>
          <span id="hud-next-road">Next road</span>
        </p>
        <p id="hud-turn" class="hud-turn">Next turn</p>
      </div>
    </section>

    <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
    <script>
      (function () {
        var Orig = maplibregl.Map;
        maplibregl.Map = function (opts) {
          var m = new Orig(opts);
          var hide = function () {
            var c = m.getCanvas && m.getCanvas();
            if (c) c.style.opacity = "0";
          };
          var show = function () {
            if (m.areTilesLoaded && !m.areTilesLoaded()) return;
            var c = m.getCanvas && m.getCanvas();
            if (c) c.style.opacity = "1";
          };
          hide();
          m.on("load", hide);
          m.on("render", show);
          m.on("idle", show);
          return m;
        };
        maplibregl.Map.prototype = Orig.prototype;
      })();
    </script>
    <script src="/assets/app.js?v=2"></script>
  </body>
</html>
