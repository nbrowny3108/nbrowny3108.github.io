<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Look-ahead" />
    <meta name="theme-color" content="#070a08" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" />
    <title>Look-ahead — Horsham</title>
    <link rel="stylesheet" href="/assets/style-afjQ3w3-.css">
  </head>
  <body>
    <div id="map" aria-label="Satellite look-ahead map"></div>

    <div id="zoom-controls" role="group" aria-label="Map zoom">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    </div>

    <section id="hud" aria-live="polite">
      <div class="hud-speed">
        <span id="hud-speed">—</span>
        <span class="hud-unit">km/h</span>
        <div class="hud-trip">
          <p class="hud-trip-readout">
            <span id="hud-trip">0.000</span>
            <span class="hud-trip-unit">km</span>
          </p>
          <button type="button" id="trip-reset">Reset</button>
        </div>
      </div>
      <div class="hud-roads">
        <p class="hud-current">
          <span class="hud-label">Now</span>
          <span id="hud-current-road">Current road</span>
        </p>
        <p class="hud-next">
          <span class="hud-label">Next</span>
          <span id="hud-next-road">Next road</span>
        </p>
        <p id="hud-turn" class="hud-turn">Next turn</p>
      </div>
    </section>

    <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
